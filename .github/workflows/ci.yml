name: tests-and-public-radar

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Audit the recorded Windows training-cost receipts without ML dependencies
        run: python -S scripts/audit_activation_cost.py --report results/activation-cost/report.json --output reports/activation-cost-ci-audit.json
      - name: Audit the recorded Windows interpreter observer receipts without launching processes
        run: python -S -m scripts.audit_process_observer --report results/process-observer/report.json --protocol fixtures/process-observer/protocol.json --freeze fixtures/process-observer/implementation.json --output reports/process-observer-ci-audit.json
      - name: Audit the recorded CPU Torch workload observer receipts without ML or process execution
        run: python -S -m scripts.audit_workload_observer --report results/workload-observer/report.json --protocol fixtures/workload-observer/protocol.json --freeze fixtures/workload-observer/implementation.json --output reports/workload-observer-ci-audit.json
      - name: Preserve the failed pretrained integration and verify its negative receipts without model execution
        run: python -S -m scripts.audit_training_observer_failure --report results/training-observer/report.json --output reports/training-observer-failure-ci-audit.json
      - name: Preserve the frozen child-image audit rejection without process or model execution
        run: python -S -m scripts.check_child_image_census_record --output reports/child-image-rejection-ci-check.json
      - name: Audit separately frozen dual self-path and OS-image receipts without process execution
        run: python -S -m scripts.audit_dual_identity_census --report results/dual-identity-census/report.json --output reports/dual-identity-census-ci-audit.json
      - name: Audit frozen narrow process-role receipts without process or model execution
        run: python -S -m scripts.audit_role_policy_probe --report results/role-policy-probe/report.json --output reports/role-policy-ci-audit.json
      - name: Preserve failed v2 training integration without process or model execution
        run: python -S -m scripts.check_training_observer_v2_record --output reports/training-observer-v2-negative-record-ci-check.json
      - name: Audit frozen v3 pretrained training observer receipts without process or model execution
        run: python -S -m scripts.audit_training_observer_v3 --report results/training-observer-v3/report.json --protocol fixtures/training-observer-v3/protocol.json --freeze fixtures/training-observer-v3/implementation.json --output reports/training-observer-v3-ci-audit.json
      - name: Preserve the rejected observer-duty end-barrier record without model or process execution
        run: python -S -m scripts.check_observer_duty_record --output reports/observer-duty-negative-record-ci-check.json
      - name: Audit the separately frozen v2 observer-duty receipts without model or process execution
        run: python -S -m scripts.audit_observer_duty_v2 --report results/observer-duty-v2/report.json --protocol fixtures/observer-duty-v2/protocol.json --freeze fixtures/observer-duty-v2/implementation.json --output reports/observer-duty-v2-ci-audit.json
      - run: python experiments/attnres_budget_probe.py --output results/attnres-budget
      - run: python experiments/attnres_memory_probe.py --output results/attnres-memory
      - run: python experiments/recovery_contract_probe.py --output results/recovery-contract
      - run: python experiments/sqlite_migration_probe.py --output results/sqlite-migration
      - run: node experiments/pi_adapter_queue_probe.mjs --output results/pi-adapter-queue
      - run: node experiments/pi_context_transform_probe.mjs --output results/pi-context-transform
      - uses: actions/upload-artifact@v4
        with:
          name: reproducible-experiments
          path: results/
  real-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1+cpu
      - run: python -m pip install numpy==2.3.5
      - name: Execute optional autograd contracts with CPU torch installed
        run: python -m unittest discover -s tests -p test_real_activation_autograd.py -v
      - name: Replay the committed pretrained activation fixture offline
        run: python experiments/real_activation_autograd_probe.py --trace fixtures/real-activation/bank.npz --manifest fixtures/real-activation/manifest.json --output reports/activation-ci --seeds 11 29 47 --warmup 1 --repeats 3
      - uses: actions/upload-artifact@v4
        with:
          name: real-activation-replay
          path: reports/activation-ci/
  activation-training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1+cpu
      - run: python -m pip install -r requirements-real-activation.txt
      - name: Check backward compression and optimizer contracts
        run: python -m unittest discover -s tests -p test_activation_training.py -v
      - name: Obtain immutable hash-verified public model assets
        run: python scripts/download_pythia.py --output local-state/ci-pythia --record reports/training-ci/model-assets.json
      - name: Reproduce the matched-token training diagnostic
        run: python experiments/activation_training_probe.py --model-dir local-state/ci-pythia --data fixtures/activation-training/data.json --manifest fixtures/activation-training/manifest.json --output reports/training-ci/replay --seeds 11 29 47 --steps 24 --batch-size 2 --lr 0.0001 --max-seconds 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-training-diagnostic
          path: reports/training-ci/
          if-no-files-found: warn
  activation-gradient:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1+cpu
      - run: python -m pip install -r requirements-real-activation.txt
      - name: Check fixed-point gradient and loss-boundary contracts
        run: python -m unittest discover -s tests -p test_activation_gradient.py -v
      - name: Check named LayerNorm save isolation contracts
        run: python -m unittest discover -s tests -p test_activation_norm_gradient.py -v
      - name: Check actual attention save isolation contracts
        run: python -m unittest discover -s tests -p test_activation_attention_gradient.py -v
      - name: Obtain pinned public model assets
        run: python scripts/download_pythia.py --output local-state/gradient-model --record reports/gradient-ci/model-assets.json
      - name: Replay the predeclared fixed-point gradient diagnostic
        run: python experiments/activation_gradient_probe.py --model-dir local-state/gradient-model --data fixtures/activation-training/data.json --manifest fixtures/activation-training/manifest.json --protocol fixtures/activation-gradient/protocol.json --output reports/gradient-ci/replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-gradient-diagnostic
          path: reports/gradient-ci/
          if-no-files-found: warn
      - name: Replay the predeclared LayerNorm save diagnostic
        run: python experiments/activation_norm_gradient_probe.py --model-dir local-state/gradient-model --data fixtures/activation-training/data.json --manifest fixtures/activation-training/manifest.json --protocol fixtures/activation-norm-gradient/protocol.json --output reports/norm-gradient-ci/replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-norm-gradient-diagnostic
          path: reports/norm-gradient-ci/
          if-no-files-found: warn
      - name: Replay the predeclared attention save diagnostic
        run: python experiments/activation_attention_gradient_probe.py --model-dir local-state/gradient-model --data fixtures/activation-training/data.json --manifest fixtures/activation-training/manifest.json --protocol fixtures/activation-attention-gradient/protocol.json --output reports/attention-gradient-ci/replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-attention-gradient-diagnostic
          path: reports/attention-gradient-ci/
          if-no-files-found: warn
      - name: Check independent AdamW update controls
        run: python -m unittest discover -s tests -p test_activation_update.py -v
      - name: Replay the predeclared actual-update diagnostic with same-runtime gradients
        run: python experiments/activation_update_probe.py --model-dir local-state/gradient-model --data fixtures/activation-training/data.json --manifest fixtures/activation-training/manifest.json --protocol fixtures/activation-update/protocol.json --attention-reference reports/attention-gradient-ci/replay/report.json --output reports/update-ci/replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-update-diagnostic
          path: reports/update-ci/
          if-no-files-found: warn
      - name: Check accumulated-state numerical and protocol controls
        run: |
          python -m unittest discover -s tests -p test_adamw_state_reference.py -v
          python -m unittest discover -s tests -p test_activation_state_update.py -v
      - name: Reproduce the frozen accumulated-state diagnostic
        run: python experiments/activation_state_update_probe.py --model-dir local-state/gradient-model --output reports/state-update-ci/replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-state-update-diagnostic
          path: reports/state-update-ci/
          if-no-files-found: warn
  activation-history:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1+cpu
      - run: python -m pip install -r requirements-real-activation.txt
      - name: Check short-history isolation, drift and incomplete-run controls
        run: |
          python -m unittest discover -s tests -p test_activation_history.py -v
          python -S -m unittest discover -s tests -p test_activation_history_auditor.py -v
      - name: Check training cost boundaries on small engineering fixtures
        run: |
          python -m unittest discover -s tests -p test_activation_cost.py -v
          python -S -m unittest discover -s tests -p test_activation_cost_auditor.py -v
      - name: Obtain immutable hash-verified model assets
        run: python scripts/download_pythia.py --output local-state/history-model --record reports/history-ci/model-assets.json
      - name: Reproduce the frozen dense and compressed history diagnostic
        run: python experiments/activation_history_probe.py --model-dir local-state/history-model --output reports/history-ci/replay
      - name: Audit public receipts without model imports
        run: python -S scripts/audit_activation_history.py --result reports/history-ci/replay --output reports/history-ci/independent-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-history-diagnostic
          path: reports/history-ci/
          if-no-files-found: warn
  public-radar:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read public GitHub research signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m frontier_radar scan --config watchlist.json --output-dir reports/live --since-hours 168
      - name: Preserve report, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-research-signals
          path: reports/live/
          if-no-files-found: warn
          retention-days: 30
