name: Reproducible fidelity case
description: A failing parameter, independent reproduction, or unsupported operator
title: "[fidelity] "
body:
  - type: markdown
    attributes:
      value: "Thank you for testing SaveScope. Please include a small original reproducer; do not upload private data or model weights."
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal runnable example
      description: Include seed, operator, exact-save types and the loss boundary.
      render: python
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Expected and observed behavior
      description: Which parameter or control failed? Scientific gate failures are useful results.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python / Torch / NumPy / OS / SaveScope commit
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Report content SHA256 and relevant metrics
      description: Attach report JSON if it contains no private information. Memory claims need actual measured peaks, not logical payload bytes.
